<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Brick Click</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <div id="gameViewport">

    <canvas
      id="game"
      width="360"
      height="180"
    ></canvas>


    <!-- ===================================================
         TOP HUD
         =================================================== -->

    <div class="top-hud">

      <div class="stat">
        <span>MONEY</span>
        <strong id="money">$0</strong>
      </div>

      <div class="stat">
        <span>HEIGHT</span>
        <strong id="height">1 m</strong>
      </div>

      <div class="stat">
        <span>BRICKS</span>
        <strong id="bricks">7</strong>
      </div>

      <div class="stat">
        <span>MULTIPLIER</span>
        <strong id="multiplier">1.0x</strong>
      </div>

      <div class="stat">
        <span>BLUEPRINTS</span>
        <strong id="blueprints">0</strong>
      </div>

    </div>


    <!-- ===================================================
         SETTINGS
         =================================================== -->

    <button
      id="settingsButton"
      class="settings-button"
      type="button"
    >
      ⚙
    </button>


    <div
      id="settingsPanel"
      class="settings-panel hidden"
    >

      <div class="settings-header">
        <h2>SETTINGS</h2>

        <button
          id="closeSettings"
          type="button"
        >
          ×
        </button>
      </div>


      <label class="slider-row">
        <span>
          MASTER
          <b id="masterVolumeText">80%</b>
        </span>

        <input
          id="masterVolume"
          type="range"
          min="0"
          max="100"
          value="80"
        />
      </label>


      <label class="slider-row">
        <span>
          MUSIC
          <b id="musicVolumeText">65%</b>
        </span>

        <input
          id="musicVolume"
          type="range"
          min="0"
          max="100"
          value="65"
        />
      </label>


      <label class="slider-row">
        <span>
          SFX
          <b id="sfxVolumeText">75%</b>
        </span>

        <input
          id="sfxVolume"
          type="range"
          min="0"
          max="100"
          value="75"
        />
      </label>


      <div class="settings-buttons">

        <button
          id="musicToggle"
          type="button"
        >
          MUSIC: ON
        </button>

        <button
          id="sfxToggle"
          type="button"
        >
          SFX: ON
        </button>

      </div>

    </div>


    <!-- ===================================================
         PILE UI
         =================================================== -->

    <div class="pile-ui">

      <strong>
        BRICK PILE
      </strong>

      <span>
        CLICK PILE TO BUILD
      </span>

      <div class="cooldown-track">

        <div
          id="cooldownFill"
          class="cooldown-fill"
        ></div>

      </div>

      <small id="cooldownText">
        READY
      </small>

    </div>


    <!-- ===================================================
         UPGRADE DRAWER
         =================================================== -->

    <button
      id="upgradeTab"
      type="button"
    >
      ◀
    </button>


    <aside
      id="upgradeDrawer"
      class="upgrade-drawer"
    >

      <div class="drawer-header">

        <div>
          <h2>UPGRADES</h2>

          <span id="upgradeCount">
            0 / 50 PURCHASED
          </span>
        </div>

      </div>


      <div class="drawer-tabs">

        <button
          class="drawer-filter active"
          data-filter="all"
          type="button"
        >
          ALL
        </button>

        <button
          class="drawer-filter"
          data-filter="build"
          type="button"
        >
          BUILD
        </button>

        <button
          class="drawer-filter"
          data-filter="cash"
          type="button"
        >
          CASH
        </button>

        <button
          class="drawer-filter"
          data-filter="auto"
          type="button"
        >
          AUTO
        </button>

        <button
          class="drawer-filter"
          data-filter="blueprint"
          type="button"
        >
          BP
        </button>

      </div>


      <div
        id="upgradeList"
        class="upgrade-list"
      ></div>


      <div class="rebirth-box">

        <h3>REBIRTH</h3>

        <p id="rebirthInfo">
          REQUIRES 150 m + $5,000
        </p>

        <button
          id="rebirthButton"
          type="button"
        >
          REBIRTH
        </button>

      </div>


      <div class="save-box">

        <button
          id="saveButton"
          type="button"
        >
          SAVE GAME
        </button>

        <span id="saveStatus">
          LOCAL SAVE
        </span>

      </div>

    </aside>


    <!-- ===================================================
         WINDOW MINIGAME
         =================================================== -->

    <div
      id="windowGame"
      class="window-game hidden"
    >

      <div class="window-card">

        <h2>
          PLACE WINDOW
        </h2>

        <p id="windowResult">
          SUCCESS = +0.1x MONEY
        </p>


        <div class="window-meter">

          <div
            id="windowSuccessZone"
            class="window-success-zone"
          ></div>

          <div
            id="windowMarker"
            class="window-marker"
          ></div>

        </div>


        <button
          id="windowPlaceButton"
          type="button"
        >
          PLACE WINDOW
        </button>

      </div>

    </div>


    <div
      id="popupLayer"
      class="popup-layer"
    ></div>

  </div>


  <script src="script.js"></script>

</body>
</html>
